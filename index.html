<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#16191a"/><meta name="description" content="Explora nuestra sala de lámparas. Enciende cada modelo y encuentra tu luz."/><link rel="icon" href="data:,"/><title>La sala · Lámparas</title></head><body>
<main id="app" aria-label="Sala interactiva de lámparas">
<div id="scene" aria-label="Vista tridimensional de la sala"></div>
<div id="targets" aria-label="Seleccionar una lámpara"></div>
<div id="loading" role="status"><span class="loading-orb"></span><p>Preparando la sala</p></div>
<div id="error" hidden role="alert"><p>No pudimos abrir la sala.</p><p class="error-detail">Prueba con un navegador que admita gráficos 3D.</p><button id="retry">Volver a intentar</button></div>
<button id="back" hidden aria-label="Volver a la sala">←</button>
<p id="hint" hidden></p>
<section id="controls" hidden aria-labelledby="lamp-name">
<div class="panel-heading"><button id="previous" aria-label="Lámpara anterior">‹</button><div><p id="lamp-kind" hidden></p><h1 id="lamp-name"></h1></div><button id="next" aria-label="Lámpara siguiente">›</button></div><div class="light-controls"><button id="power" role="switch" aria-checked="true" aria-label="Encender lámpara"><span class="switch-track"><span></span></span><span id="power-label" hidden>Encendida</span></button>
<div class="temperatures" role="group" aria-label="Temperatura de luz"><button data-temp="warm" aria-pressed="true"><i class="warm"></i>Cálida</button><button data-temp="neutral" aria-pressed="false"><i class="neutral"></i>Neutra</button><button data-temp="cool" aria-pressed="false"><i class="cool"></i>Fría</button></div></div>
<p id="save-status" class="sr-only" role="status"></p>
</section>
<button id="sound" aria-pressed="true" aria-label="Silenciar sonidos"></button>
<div id="announcement" class="sr-only" aria-live="polite"></div>
</main><script type="module" src="/src/main.js"></script></body></html>
